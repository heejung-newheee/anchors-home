stages:
  - build
  - deploy

variables:
  TARGET_BRANCH: "dev"

workflow:
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $TARGET_BRANCH

build-job:
  stage: build
  artifacts:
    paths:
      - ./out
  before_script:
    - npm install --force
  script:
    - npm run build
  after_script:
    - ls -al
    - echo "build success!"
  tags:
    - instance-ssh #공통 runner 이용


deploy-job:
  stage: deploy
  before_script:
    - ls -al
  script:
    - cp -r ./out/* /var/www/www-2022-new
  after_script:
    - ls -al
    - echo "deploy success!"
  tags:
    - instance-ssh #공통 runner 이용, 같은 서버내 배포로 cp 할 것이라 docker 아닌 ssh 로