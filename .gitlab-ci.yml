stages:
  - build
  - deploy

variables:
  DEV_BRANCH: "dev"
  PRD_BRANCH: "prd"

workflow:
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $DEV_BRANCH || $CI_COMMIT_BRANCH == $PRD_BRANCH

build-job:
  stage: build
  only:
    - dev
    - prd
  artifacts:
    paths:
      - ./out
    expire_in: 1 hour
  before_script:
    - npm install --force
  script:
    - npm run build
  after_script:
    - ls -al
    - echo "build success!"
  tags:
    - instance-ssh #공통 runner 이용


deploy-to-dev-job:
  stage: deploy
  only : 
    - dev
  before_script:
    - echo "Starting deploy to dev..."
    - ls -al
  script:
    - set -x
    - echo "Copying files to /var/www/www-2022-dev"
    - cp -r ./out/* /var/www/www-2022-dev || echo "Copy failed: $?" > /dev/stderr
  after_script:
    - echo "Cleaning up ./out"
    - rm -rf ./out || echo "Cleanup failed" > /dev/stderr
    - echo "Deploy to dev completed."
  tags:
    - instance-ssh #공통 runner 이용, 같은 서버내 배포로 cp 할 것이라 docker 아닌 ssh 로

deploy-to-prd-job:
  stage: deploy
  only : 
    - prd
  before_script:
    - echo "Starting deploy to prd..."
    - ls -al
  script:
    - set -x
    - echo "Copying files to /var/www/www-2022-new"
    - cp -r ./out/* /var/www/www-2022-new || echo "Copy failed: $?" > /dev/stderr
  after_script:
    - echo "Cleaning up ./out"
    - rm -rf ./out || echo "Cleanup failed" > /dev/stderr
    - echo "Deploy to prd completed."
  tags:
    - instance-ssh #공통 runner 이용, 같은 서버내 배포로 cp 할 것이라 docker 아닌 ssh 로
