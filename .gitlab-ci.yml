stages:
  - build
  - deploy

variables:
  DEV_BRANCH: "dev"
  PRD_BRANCH: "prd"

workflow:
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $DEV_BRANCH || $CI_COMMIT_BRANCH == $PRD_BRANCH

build-job:
  stage: build
  only:
    - dev
    - prd
  artifacts:
    paths:
      - ./out
  before_script:
    - npm install --force
  script:
    - npm run build
  after_script:
    - ls -al
    - echo "build success!"
  tags:
    - instance-ssh #공통 runner 이용


deploy-to-dev-job:
  stage: deploy
  only : 
    - dev
  before_script:
    - ls -al
  script:
    - cp -r ./out/* /var/www/www-2022-dev
  after_script:
    - rm -rf "%CACHE_PATH%/CI_PIPELINE_ID%"
    - pwd
    - ls -al
    - echo "deploy success!"
  tags:
    - instance-ssh #공통 runner 이용, 같은 서버내 배포로 cp 할 것이라 docker 아닌 ssh 로

deploy-to-prd-job:
  stage: deploy
  only : 
    - prd
  before_script:
    - ls -al
  script:
    - cp -r ./out/* /var/www/www-2022-new
  after_script:
    - rm -rf "%CACHE_PATH%/CI_PIPELINE_ID%"
    - pwd
    - ls -al
    - echo "deploy success!"
  tags:
    - instance-ssh #공통 runner 이용, 같은 서버내 배포로 cp 할 것이라 docker 아닌 ssh 로
